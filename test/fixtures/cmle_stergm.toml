model = "Form(~edges + mutual) + Persist(~edges + mutual), estimate=\"CMLE\", control.tergm(seed = s) for each s in cmle_seeds; logLik() by tergm's bridge sampler; tri_*: Form(~edges + mutual + cyclicalties + transitiveties) + Persist(~the same) on the recip panel, CMLE under the same seeds and CMPLE"
cmle_seeds = "1001,1002,1003,1004,1005,1006,1007,1008,1009,1010,1011"
exact = "exact conditional MLE by enumeration of the <= 4 states of every unordered pair and Newton's method (no Monte Carlo); exact standard errors from the exact Fisher information"

[tolerance]
# A Monte-Carlo MLE is a random variable: two runs differ by their seeds.
# `*_cmle_seed_sd` in [values] is tergm, refitted under 11 seeds,
# disagreeing with itself. The Julia testset compares ONE seeded TERGM.jl
# fit with the EXACT conditional MLE (`*_exact_coefficients`, computed here
# without Monte Carlo) at 4 x that seed sd, floored at 5% of the exact
# standard error: tergm's own seed sd on some coefficients is so small
# (it adapts its MCMC sample size to an effective-size target, which
# TERGM.jl does not) that 4 x sd would otherwise demand more precision
# than a fixed-sample Monte-Carlo MLE has. 5% of a standard error is far
# below anything that changes an inference, and on the reciprocity panel
# it is far below the CMPLE-to-CMLE gap (`recip_cmple_minus_exact`), so a
# fit that returned the CMPLE fails. Standard errors are compared with the
# exact ones at 10% relative (the Fisher information is estimated from
# the MCMC sample, plus the Monte-Carlo term). The log-likelihood is
# compared with the exact maximum at 4 x tergm's seed sd of its bridge
# estimate, floored at 0.5.
main_exact_coefficients = 0.04886
recip_exact_coefficients = 0.09345
main_exact_loglik = 12.89
recip_exact_loglik = 8.253
#
# THE TRIADIC MODEL (`tri_*`). No exact answer exists, so one seeded
# TERGM.jl fit is compared with the MEAN of tergm's 11 fits. Both are
# Monte-Carlo estimates of the same maximiser; the tolerance per
# coefficient (`tri_coefficient_tolerances`) is 4 x tergm's seed sd x
# sqrt(1 + 1/11) (the sd of a single fit minus an 11-fit mean), floored at
# 10% of tergm's mean standard error -- the floor again because tergm's
# adaptive sampling makes its seed sd smaller than a fixed-sample MCMLE's.
# The CMPLE is deterministic and compared at 1e-6, as in panel_stergm.toml.
tri_cmple_coefficients = 1e-6
tri_cmple_std_errors = 1e-4
tri_cmple_loglik = 1e-5

