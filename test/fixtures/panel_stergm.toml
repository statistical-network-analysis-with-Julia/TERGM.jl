[tolerance]
# CMPLE COEFFICIENTS AND STANDARD ERRORS. edges + nodematch is
# dyad-independent, so the conditional pseudo-likelihood IS the conditional
# likelihood: CMPLE is the exact conditional MLE and both packages are
# maximizing the same strictly-concave logistic likelihood on the same rows.
# No Monte Carlo, no approximation, nothing to average over. The ONLY
# difference two correct implementations can have here is where their
# optimizers stop -- and on this model that difference is measurable, and it
# is R's, not Julia's:
#
#   tergm's CMPLE runs R's `glm` at its default epsilon = 1e-8 and stops
#   there. Against the same glm taken to epsilon = 1e-14, tergm's shipped
#   answer is off by ~1.5e-8 in the coefficients and ~6e-6 in the standard
#   errors (the SEs are the more sensitive of the two, being a function of
#   the fitted probabilities). TERGM.jl's Newton-Raphson lands on the exact
#   optimum and reproduces the tightly-converged R glm to ~1e-10.
#
# So `coefficients`/`std_errors` are compared to tergm AS SHIPPED at a
# tolerance that covers tergm's own optimizer slack -- 1e-6 on the
# coefficients (60x the observed slack) and 1e-4 on the standard errors
# (16x the observed slack, and still 0.13% of the smallest SE in the model,
# far too tight for any real discrepancy to hide under). Widening the SE
# tolerance is not a concession: `exact_std_errors` below is the same
# estimator taken to convergence, and THAT is asserted at 1e-6, where
# TERGM.jl passes with four orders of magnitude to spare. The loose number
# measures R; the tight number measures Julia.
coefficients = 1e-6
std_errors = 1e-4
exact_coefficients = 1e-6
exact_std_errors = 1e-6
# The per-side vectors are the same numbers split by side (`Form(1)~` rows
# into `formation_*`, `Persist(1)~` rows into `persistence_*`) and carry the
# same tolerances: they exist so that the accessors `formation_coef(fit)`,
# `formation_se(fit)`, `persistence_coef(fit)`, `persistence_se(fit)` can be
# pinned BY NAME against tergm's Persist() block (the persistence sign
# convention: tergm >= 4 Persist(), positive = ties last longer).
formation_coefficients = 1e-6
formation_std_errors = 1e-4
persistence_coefficients = 1e-6
persistence_std_errors = 1e-4
#
# BLOCK-BOOTSTRAP STANDARD ERRORS. A bootstrap SE is a random variable: R
# and Julia draw different resamples of the transitions, so they cannot
# agree to machine precision however correct both are. Read
# `boot_se_seed_sd` in [values] first -- that is THIS bootstrap, rerun under
# five further seeds, disagreeing with itself. With only 7 transitions to
# resample the block bootstrap is coarse by construction and that sd is
# large relative to the SE itself; no cross-implementation tolerance can
# sit below it. The tolerance is 3x the largest such sd, which is the
# honest resolution of the comparison. It is deliberately NOT used to make
# a claim the data cannot support: what this checks is that TERGM.jl's
# bootstrap SEs agree with R's to within the noise of the bootstrap itself,
# not that they are equal.
#
# Measured on the Julia side (mean of 5 TERGM.jl bootstraps at declared
# seeds, 400 resamples each): |mean(TERGM.jl) - R| = 0.0032, 0.0040,
# 0.0006, 0.0071. TERGM.jl's own seed-to-seed sd is 0.0023, 0.0023, 0.0009,
# 0.0051 -- the same order as R's. The largest gap (0.0071, on persistence
# nodematch) is 1.7x R's seed-to-seed sd on that SE, i.e. the two bootstraps
# differ by about as much as either differs from itself. Both sides are
# seeded, so the Julia comparison is deterministic and cannot flake.
boot_std_errors = 0.01256
#
# THE BOUNDARY PANEL. The persistence nodematch has no finite CMPLE (no
# same-group tie ever persists). TERGM.jl fixes it at -Inf and fits the rest
# on the untouched rows, as R ergm's drop=TRUE does; tergm 4.2.2 warns
# "The MPLE does not exist!" and returns a point on the asymptote. The
# FINITE coefficients are the same estimator on the same rows in both
# packages (the asymptote's rows contribute nothing to them), so they are
# compared exactly as the main panel's: against tergm as shipped at a
# tolerance covering glm's default-epsilon slack (`boundary_cmple_vs_glm_*`
# in [values] measures it), and against the tightly converged glm at 1e-6.
# The log-likelihood differs by the asymptote's tail -- the dropped rows at
# tergm's finite point contribute sum(log(1 - p)) with p ~ 1e-8, frozen as
# `boundary_asymptote_tail` -- plus glm's slack; 1e-5 covers both by two
# orders of magnitude. The infinite coefficient is asserted by SIGN only
# (`boundary_fixed_sign`): R's -19.6 is where glm stopped, not a number.
boundary_finite_coefficients = 1e-6
boundary_finite_std_errors = 1e-4
boundary_exact_finite_coefficients = 1e-6
boundary_exact_finite_std_errors = 1e-6
boundary_loglik = 1e-5
#
# DYAD-DEPENDENT AND UNDIRECTED CMPLE. tergm as shipped (glm at its default
# epsilon), compared at the main panel's as-shipped tolerances: 1e-6 on the
# coefficients and 1e-4 on the standard errors -- two and one orders of
# magnitude above the optimizer slack measured on the main panel (1.5e-8 /
# 6.1e-6), and two orders of magnitude below the smallest standard error
# in any of these models. The log-likelihood at 1e-5 (glm's stopping slack
# in the deviance is ~1e-9). A dyad-dependent CMPLE is a deterministic
# function of the panel and the change statistics, so two correct
# implementations agree on it to the optimizer's slack exactly as they do on
# the independent formula; what these keys pin is the evaluation of mutual /
# triangle / kstar change statistics ON Y+ and Y- and the undirected
# n(n-1)/2 free-dyad enumeration (`undirected_loglik_nobs`), not the
# adequacy of the approximation.
#
# EXPANDING TERMS (nodefactor / nodemix / degree ranges). The same estimator
# on the same rows once the columns are the same, so the as-shipped
# tolerances apply; what these keys pin is that the columns ARE the same --
# `<prefix>_term_names` is asserted verbatim, so a pooled or mislabelled
# expansion fails on the names before any number is compared.
dyaddep_mutual_coefficients = 1e-6
dyaddep_mutual_std_errors = 1e-4
dyaddep_mutual_loglik = 1e-5
dyaddep_triangle_coefficients = 1e-6
dyaddep_triangle_std_errors = 1e-4
dyaddep_triangle_loglik = 1e-5
undirected_coefficients = 1e-6
undirected_std_errors = 1e-4
undirected_loglik = 1e-5
undirected_kstar_coefficients = 1e-6
undirected_kstar_std_errors = 1e-4
undirected_kstar_loglik = 1e-5
expand_undirected_coefficients = 1e-6
expand_undirected_std_errors = 1e-4
expand_undirected_loglik = 1e-5
expand_undirected_degree_coefficients = 1e-6
expand_undirected_degree_std_errors = 1e-4
expand_undirected_degree_loglik = 1e-5
expand_directed_coefficients = 1e-6
expand_directed_std_errors = 1e-4
expand_directed_loglik = 1e-5
expand_directed_degree_coefficients = 1e-6
expand_directed_degree_std_errors = 1e-4
