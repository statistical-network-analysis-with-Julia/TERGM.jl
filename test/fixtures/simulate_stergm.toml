name = "simulate_stergm"

[provenance]
r_version = "4.6.1"
tergm_version = "4.2.2"
ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20261003
script = "test/fixtures/r/simulate_stergm.R"
date = "2026-10-02"
dataset = "simulated: one 20-actor directed starting network, Bernoulli(0.12), frozen below as an edge list"
model = "simulate(nw ~ Form(~...) + Persist(~...), coef = theta, time.slices = 1, dynamic = TRUE, nsim = 1000, output = \"final\") under each of the seeds 2001,2002,2003,2004,2005, MCMC.burnin.min = MCMC.burnin.max = 20000; (a) edges + mutual, (b) edges + mutual + cyclicalties + transitiveties"
exact = "model (a): exact expectations and variances of formed, persisted, and edges/mutual of Y+ and Y- by enumeration of the pair states"

[tolerance]
# Means of simulated statistics are compared at their Monte-Carlo error:
# the Julia testset uses 4 x sd x sqrt(1/N_julia + 1/N_ref) per statistic,
# with `*_sds` the per-draw standard deviations frozen in [values] and
# N_ref = 5000 for tergm's mean (N_ref = Inf for the exact expectations).
# `*_seed_sd` records how much tergm's 1000-draw mean moves between its
# five seeds -- the same quantity, measured: sd / sqrt(1000). No fixed
# number is given here because the tolerance depends on the Julia sample
# size; `mc_sigmas` is the multiplier.
mc_sigmas = 4

